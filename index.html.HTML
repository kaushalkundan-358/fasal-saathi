<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  /* Agricultural Emerald Green & Crisp White Palette */
  --green-900:#064E3B; --green-800:#065F46; --green-700:#047857; --green-600:#059669; --green-500:#10B981; --green-100:#D1FAE5; --green-50:#ECFDF5;
  --orange-700:#B45309; --orange-600:#D97706; --orange-500:#F59E0B; --orange-100:#FEF3C7; --orange-50:#FFFBEB;
  --blue-700:#1E40AF; --blue-600:#2563EB; --blue-500:#3B82F6; --blue-100:#E0E7FF;
  --red-600:#DC2626; --red-100:#FEE2E2;
  --ink-900:#0F172A; --ink-700:#334155; --ink-500:#64748B; --ink-300:#94A3B8;
  --paper:#F8FAFC; --card:#FFFFFF; --cream:#F0FDF4; --line:#E2E8F0; --line-strong:#CBD5E1;
}

/* =================== ALL-CREAM THEME =================== */
body.cream-theme{
  --paper:#FAF3E0;
  --card:#FFFDD0;
  --cream:#FEF3C7;
  --line:#E8DCB8;
  --line-strong:#D9C898;
  --ink-900:#1A2E26;
  --ink-700:#2F4A3E;
  --ink-500:#5A7266;
  --ink-300:#8DA095;
  background-color:#FAF3E0 !important;
  color:var(--ink-900) !important;
}

body.cream-theme .bg-white,
body.cream-theme .bg-white\/95,
body.cream-theme .bg-white\/90,
body.cream-theme .bg-white\/80{
  background-color:#FFFDD0 !important;
}

body.cream-theme .card,
body.cream-theme .card-flat{
  background-color:#FFFDD0 !important;
  border-color:#E8DCB8 !important;
  box-shadow:0 4px 20px -6px rgba(6,78,59,0.06), 0 1px 3px rgba(0,0,0,0.02) !important;
}

body.cream-theme .card-cream{
  background-color:#FEF3C7 !important;
  border-color:#D9C898 !important;
}

body.cream-theme section#faq,
body.cream-theme #faq{
  background-color:#FAF3E0 !important;
  border-color:#E8DCB8 !important;
}

body.cream-theme #faq details,
body.cream-theme section#faq details,
body.cream-theme details.card{
  background-color:#FFFDD0 !important;
  border:1.5px solid #D9C898 !important;
  box-shadow:0 2px 8px rgba(217,119,6,0.08) !important;
}

body.cream-theme #faq details[open],
body.cream-theme section#faq details[open]{
  background-color:#FEF3C7 !important;
  border-color:#B45309 !important;
}

body.cream-theme section#centres{
  background-color:#F5EED8 !important;
  border-color:#E8DCB8 !important;
}

body.cream-theme aside{
  background-color:#FFFDD0 !important;
  border-color:#E8DCB8 !important;
}

body.cream-theme .modal-backdrop > div,
body.cream-theme #modal-root > div > div{
  background-color:#FFFDD0 !important;
  border-color:#E8DCB8 !important;
}

body.cream-theme .input,
body.cream-theme select{
  background-color:#FFFDF0 !important;
  border-color:#D9C898 !important;
  color:#1A2E26 !important;
}

body.cream-theme .bg-\[var\(--paper\)\]{
  background-color:#FFFDF0 !important;
  border-color:#E8DCB8 !important;
}
body.cream-theme .bg-\[var\(--cream\)\]{
  background-color:#FEF3C7 !important;
  border-color:#D9C898 !important;
}

body.cream-theme .btn-outline{
  background-color:#FFFDD0 !important;
  border-color:#D9C898 !important;
  color:#2F4A3E !important;
}
body.cream-theme .btn-outline:hover{
  background-color:#FEF3C7 !important;
  border-color:#059669 !important;
  color:#064E3B !important;
}

body.cream-theme .btn-secondary{
  background-color:#FEF3C7 !important;
  color:#065F46 !important;
  border-color:#D9C898 !important;
}
body.cream-theme .btn-secondary:hover{
  background-color:#FDE68A !important;
  border-color:#059669 !important;
}

body.cream-theme .sidebar-link:hover{
  background-color:#FEF3C7 !important;
  color:#064E3B !important;
}
body.cream-theme .sidebar-link.active{
  background:linear-gradient(135deg, var(--green-800), var(--green-700)) !important;
  color:#ffffff !important;
}

/* =================== BASE STYLING & ULTRA SMOOTH ANIMATIONS =================== */
*{box-sizing:border-box; transition:background-color .25s ease, border-color .25s ease;}
html{scroll-behavior:smooth;}
body{
  background:var(--paper); color:var(--ink-900); font-family:'Inter','Noto Sans Devanagari',sans-serif;
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5; overflow-x:hidden;
  transition:background-color .35s ease, color .35s ease;
}
.font-display{font-family:'Plus Jakarta Sans','Noto Sans Devanagari',sans-serif;}
.font-mono{font-family:'JetBrains Mono',monospace;}
::selection{background:var(--green-100); color:var(--green-900);}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-300)}
:focus-visible{outline:2.5px solid var(--green-600); outline-offset:2px; border-radius:8px;}

/* Smooth Cards */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:20px;
  box-shadow:0 4px 20px -6px rgba(6,78,59,0.06), 0 1px 3px rgba(0,0,0,0.02);
  transition:transform .28s cubic-bezier(.16,1,.3,1), box-shadow .28s cubic-bezier(.16,1,.3,1), border-color .25s ease;
}
.card-flat{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  transition:all .22s cubic-bezier(.16,1,.3,1);
}
.card-cream{
  background:var(--cream); border:1px solid var(--line-strong); border-radius:16px;
  transition:all .22s cubic-bezier(.16,1,.3,1);
}

/* Smooth Buttons & Micro-Interactions */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-weight:700;font-size:.875rem;
  border-radius:12px;padding:.65rem 1.25rem;transition:all .2s cubic-bezier(.16,1,.3,1);cursor:pointer;border:1px solid transparent;white-space:nowrap;
  user-select:none;
}
.btn:hover{transform:translateY(-1.5px);}
.btn:active{transform:scale(0.96) translateY(0);}
.btn-primary{background:linear-gradient(135deg, var(--green-600), var(--green-700));color:#fff;box-shadow:0 4px 14px -3px rgba(5,150,105,0.4);}
.btn-primary:hover{background:linear-gradient(135deg, var(--green-700), var(--green-800));box-shadow:0 8px 22px -3px rgba(4,120,87,0.5);}
.btn-secondary{background:var(--cream);color:var(--green-800);border-color:var(--line-strong);}
.btn-secondary:hover{background:var(--green-100);color:var(--green-900);border-color:var(--green-600);box-shadow:0 4px 12px -2px rgba(6,78,59,0.12);}
.btn-outline{background:transparent;color:var(--ink-700);border-color:var(--line-strong);}
.btn-outline:hover{border-color:var(--green-600); background:#fff; color:var(--green-700);box-shadow:0 4px 12px -2px rgba(0,0,0,0.06);}
.btn-orange{background:linear-gradient(135deg, #F59E0B, #EA580C);color:#fff;box-shadow:0 4px 12px -3px rgba(234,88,12,0.35);font-weight:700;}
.btn-orange:hover{background:linear-gradient(135deg, #EA580C, #C2410C);box-shadow:0 8px 20px -3px rgba(194,65,12,0.45);}
.btn-ghost{background:transparent;color:var(--ink-500);}
.btn-ghost:hover{background:var(--cream); color:var(--green-800);}
.btn-sm{padding:.45rem .9rem; font-size:.8rem; border-radius:10px;}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none !important;}

/* Inputs with Smooth Focus Glow */
.input{
  width:100%;border:1.5px solid var(--line-strong);border-radius:12px;padding:.65rem .85rem;font-size:.88rem;
  background:#fff;transition:border-color .18s ease, box-shadow .18s ease, background-color .2s ease;color:var(--ink-900);
}
.input:focus{border-color:var(--green-600); box-shadow:0 0 0 3.5px rgba(5,150,105,0.18); outline:none;}
.input::placeholder{color:var(--ink-300);}
.label{font-size:.78rem;font-weight:700;color:var(--ink-700);margin-bottom:.35rem;display:block;letter-spacing:.01em;}

/* Badges & Pills */
.badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:700;padding:.25rem .65rem;border-radius:999px;letter-spacing:.01em;transition:all .2s ease;}
.badge-green{background:var(--green-100);color:var(--green-800);border:1px solid rgba(5,150,105,0.22);}
.badge-orange{background:var(--orange-100);color:var(--orange-700);border:1px solid rgba(217,119,6,0.25);}
.badge-blue{background:var(--blue-100);color:var(--blue-700);border:1px solid rgba(37,99,235,0.15);}
.badge-red{background:var(--red-100);color:var(--red-600);border:1px solid rgba(220,38,38,0.15);}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;}

/* Animations & Keyframes */
.page-enter{animation:pageEnter .32s cubic-bezier(.16,1,.3,1) both;}
.modal-box{animation:modalIn .28s cubic-bezier(.16,1,.3,1) both;}
.fade-in{animation:fadeIn .25s ease both;}
.fade-up{animation:fadeUp .32s cubic-bezier(.16,1,.3,1) both;}
.fade-down{animation:fadeDown .28s cubic-bezier(.16,1,.3,1) both;}

@keyframes pageEnter{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
@keyframes modalIn{from{opacity:0; transform:scale(0.95) translateY(14px)} to{opacity:1; transform:scale(1) translateY(0)}}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
@keyframes fadeUp{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)}}
@keyframes fadeDown{from{opacity:0; transform:translateY(-12px)} to{opacity:1; transform:translateY(0)}}

.stagger > *{animation:fadeUp .35s cubic-bezier(.16,1,.3,1) both;}
.stagger > *:nth-child(1){animation-delay:.02s}.stagger > *:nth-child(2){animation-delay:.05s}.stagger > *:nth-child(3){animation-delay:.08s}.stagger > *:nth-child(4){animation-delay:.11s}.stagger > *:nth-child(5){animation-delay:.14s}.stagger > *:nth-child(6){animation-delay:.17s}

.hover-lift{transition:transform .24s cubic-bezier(.16,1,.3,1), box-shadow .24s cubic-bezier(.16,1,.3,1);}
.hover-lift:hover{transform:translateY(-3px); box-shadow:0 18px 30px -10px rgba(6,78,59,.12);}

.grain-hero{
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(245,158,11,.22), transparent 65%),
    radial-gradient(800px 450px at 5% 20%, rgba(16,185,129,.28), transparent 60%),
    linear-gradient(180deg, #064E3B 0%, #065F46 45%, #047857 100%);
}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(16,185,129,.6)} 70%{box-shadow:0 0 0 14px rgba(16,185,129,0)} 100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.pulse-ring{animation:pulseRing 2.2s infinite;}
@keyframes tokenMove{0%{left:6%} 100%{left:85%}}
.token-pill{animation:tokenMove 3.6s cubic-bezier(.4,0,.2,1) infinite alternate;}

.progress-track{height:10px;border-radius:999px;background:var(--cream);overflow:hidden;border:1px solid var(--line);}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green-600),var(--orange-500));transition:width .65s cubic-bezier(.4,0,.2,1);}
.timeline-line{position:absolute;left:19px;top:0;bottom:0;width:2px;background:var(--line-strong);}
.sidebar-link{display:flex;align-items:center;gap:.7rem;padding:.65rem .85rem;border-radius:12px;font-size:.85rem;font-weight:700;color:var(--ink-500);transition:all .18s ease;}
.sidebar-link:hover{background:var(--cream); color:var(--green-800); transform:translateX(3px);}
.sidebar-link.active{background:linear-gradient(135deg, var(--green-800), var(--green-700)) !important; color:#fff; box-shadow:0 4px 14px -2px rgba(6,95,70,0.38); transform:translateX(3px);}
/* Shared interaction motion keeps controls lively even when they do not use a
   component-specific class. */
:where(a, button, input, select, textarea, summary, [role="button"]){
  transition:color .2s ease, background-color .2s ease, border-color .2s ease,
    box-shadow .2s ease, opacity .2s ease, transform .2s cubic-bezier(.16,1,.3,1);
}
:where(a, button, summary, [role="button"]):hover{filter:saturate(1.04);}
:where(button, [role="button"]):active{transform:scale(.97);}
button svg, a svg{transition:transform .2s cubic-bezier(.16,1,.3,1);}
:where(button, a, [role="button"]):hover svg{transform:translateX(1px) scale(1.04);}
summary{transition:color .2s ease, background-color .2s ease;}
summary::-webkit-details-marker{transition:transform .2s ease;}
details[open] summary::-webkit-details-marker{transform:rotate(90deg);}
tr{transition:background-color .2s ease, transform .2s ease;}
tr:hover{transform:translateX(2px);}
.modal-backdrop{background:rgba(15,23,42,.65); backdrop-filter:blur(8px); transition:all .25s ease; animation:backdropIn .24s ease both;}
.toast{animation:toastIn .32s cubic-bezier(.16,1,.3,1) both;}
@keyframes toastIn{from{opacity:0; transform:translateX(20px) scale(.95)} to{opacity:1; transform:translateX(0) scale(1)}}
@keyframes backdropIn{from{opacity:0;backdrop-filter:blur(0)} to{opacity:1;backdrop-filter:blur(8px)}}
.loading-shimmer{background:linear-gradient(100deg,var(--paper) 20%,var(--cream) 40%,var(--paper) 60%);background-size:200% 100%;animation:shimmer 1.6s ease-in-out infinite;}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;color:#fff;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,0.12);transition:transform .2s ease;}
.avatar:hover{transform:scale(1.05);}

/* Give dynamically rendered panels a gentle lift without changing layout. */
#app > .page-enter{transform-origin:top center;}
#app .card, #app .card-flat, #app .card-cream{will-change:transform, box-shadow;}
#modal-root > .modal-backdrop > .modal-box{will-change:transform, opacity;}

@media (prefers-reduced-motion:reduce){
  *, *::before, *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    scroll-behavior:auto !important;
    transition-duration:.01ms !important;
  }
  .hover-lift:hover, .sidebar-link:hover, tr:hover{transform:none;}
}
</style>
</head>

/* ============================= SUPABASE DATA SYNC ============================= */
async function loadSupabaseData(){
  if(!supabaseClient) return;
  try{
    const [cRes, sRes, fRes, bRes, rRes] = await Promise.allSettled([
      supabaseClient.from('centres').select('*'),
      supabaseClient.from('schedules').select('*'),
      supabaseClient.from('farmers').select('*', { count: 'exact' }),
      supabaseClient.from('bookings').select('*', { count: 'exact' }),
      supabaseClient.from('procurement_records').select('*', { count: 'exact' })
    ]);

    if(cRes.status==='fulfilled' && cRes.value.data && cRes.value.data.length > 0){
      const localCentres = new Map(CENTRES.map(centre => [String(centre.id), centre]));
      CENTRES = cRes.value.data.map(centre => localCentres.get(String(centre.id)) || centre);
      const remoteCentreIds = new Set(cRes.value.data.map(centre => String(centre.id)));
      CENTRES.push(...[...localCentres.values()].filter(centre => !remoteCentreIds.has(String(centre.id))));
    }
    if(sRes.status==='fulfilled' && sRes.value.data && sRes.value.data.length > 0){
      const localSchedules = new Map(SCHEDULES.map(schedule => [String(schedule.id), schedule]));
      SCHEDULES = sRes.value.data.map(schedule => localSchedules.get(String(schedule.id)) || schedule);
      const remoteScheduleIds = new Set(sRes.value.data.map(schedule => String(schedule.id)));
      SCHEDULES.push(...[...localSchedules.values()].filter(schedule => !remoteScheduleIds.has(String(schedule.id))));
    }
    if(fRes.status==='fulfilled' && fRes.value.data){
      if(fRes.value.data.length > 0){
        const localByPhone = new Map(FARMERS.filter(f => f.phone).map(f => [String(f.phone).replace(/\D/g, '').slice(-10), f]));
        const remotePhones = new Set(fRes.value.data.filter(f => f.phone).map(f => String(f.phone).replace(/\D/g, '').slice(-10)));
        FARMERS = fRes.value.data.map(farmer => localByPhone.get(String(farmer.phone || '').replace(/\D/g, '').slice(-10)) || farmer);
        FARMERS.push(...[...localByPhone.values()].filter(farmer => !remotePhones.has(String(farmer.phone).replace(/\D/g, '').slice(-10))));
      }
      if(fRes.value.count !== null && fRes.value.count !== undefined){
        STATE.supabaseFarmerCount = Math.max(fRes.value.count, FARMERS.length);
      } else {
        STATE.supabaseFarmerCount = FARMERS.length;
      }
    }
    if(bRes.status==='fulfilled' && bRes.value.data){
      if(bRes.value.data.length > 0) BOOKINGS = bRes.value.data;
      if(bRes.value.count !== null && bRes.value.count !== undefined){
        STATE.supabaseBookingCount = bRes.value.count;
      } else {
        STATE.supabaseBookingCount = BOOKINGS.length;
      }
    }
    if(rRes.status==='fulfilled' && rRes.value.data && rRes.value.data.length > 0){
      RECORDS = rRes.value.data;
    }
    persistState();
    buildLiveState();
    render();
  }catch(err){
    console.log('Supabase sync notice:', err);
  }
}

function isBookingMissed(booking){
  if(!booking || !['Booked','In Progress'].includes(booking.status)) return false;
  const slotTime = booking.booking_date || `${booking.procurement_date || ''}T${booking.call_time || '23:59'}`;
  const missedAt = new Date(slotTime.replace(' ', 'T'));
  return !Number.isNaN(missedAt.getTime()) && missedAt.getTime() < Date.now();
}

function rescheduleBooking(bookingId){
  const booking = BOOKINGS.find(item => String(item.id) === String(bookingId));
  if(!booking || !isBookingMissed(booking)) return;
  booking.status = 'Missed';
  persistState();
  STATE.booking = {step:1, crop:(CROPS.find(c => c.name === booking.crop) || CROPS[0]).id, qty:booking.quantity || 40, landArea:FARMER.land_area, centre:1, customDate:'2026-08-25', customTime:'09:00', token:null, trackingId:null};
  navigate('farmer-book');
}

function calculateTimingForBooking(scheduleId, positionInSlot=1, customTimeStr=null, customDateStr=null){
  let startMinutes = 8 * 60 + 30; // default 08:30 AM
  let targetDate = customDateStr || '2026-08-25';

  if(customTimeStr && customTimeStr.includes(':')){
    const timeParts = String(customTimeStr).trim().match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
    if(timeParts){
      let hours = parseInt(timeParts[1], 10);
      const minutes = parseInt(timeParts[2], 10);
      const meridiem = (timeParts[3] || '').toUpperCase();
      if(meridiem === 'PM' && hours < 12) hours += 12;
      if(meridiem === 'AM' && hours === 12) hours = 0;
      startMinutes = hours * 60 + minutes;
    }
  } else if(scheduleId){
    const schedule = SCHEDULES.find(s=>String(s.id)===String(scheduleId));
    if(schedule && schedule.start_time){
      const [hStr, mStr] = schedule.start_time.split(':');
      startMinutes = parseInt(hStr, 10) * 60 + parseInt(mStr, 10);
      targetDate = schedule.procurement_date;
    }
  }
  
  let farmerMinutes = startMinutes + (positionInSlot - 1) * 12;
  let arrivalMinutes = Math.max(0, farmerMinutes - 15); // arrive 15 min early
  
  const fmtMins = (mins) => {
    let hh = Math.floor(mins / 60) % 24;
    let mm = mins % 60;
    let ampm = hh >= 12 ? 'PM' : 'AM';
    let h12 = hh > 12 ? hh - 12 : (hh === 0 ? 12 : hh);
    return `${String(h12).padStart(2,'0')}:${String(mm).padStart(2,'0')} ${ampm}`;
  };

  return {
    callTime: fmtMins(farmerMinutes),
    arrivalTime: fmtMins(arrivalMinutes),
    estDate: targetDate
  };
}

function getQueueMetrics(booking){
  const queue = BOOKINGS.filter(item => item.schedule_id === booking.schedule_id && ['Booked','In Progress'].includes(item.status))
    .sort((a,b) => (a.id || 0) - (b.id || 0));
  const current = queue.find(item => item.status === 'In Progress') || null;
  const ahead = booking.status === 'In Progress' ? 0 : queue.filter(item => item.id < booking.id).length;
  return {current, ahead, waitMinutes: ahead * 12};
}

function generateFreshTrackingId(){
  const randNum = Math.floor(100000 + Math.random() * 900000);
  return `TRK-2026-${randNum}`;
}

function generateSequentialToken(centreId){
  const centre = CENTRES.find(c=>String(c.id)===String(centreId));
  const prefix = centre ? centre.name.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase() : 'CTR';
  const existingCount = BOOKINGS.filter(b=>{
    const sched = scheduleFor(b);
    return sched && String(sched.centre_id) === String(centreId);
  }).length;
  return `${prefix}-${String(existingCount + 1).padStart(3, '0')}`;
}

function buildLiveState(){
  OFFICER_QUEUE = BOOKINGS.map(b => {
    const farmer = FARMERS.find(f => String(f.id) === String(b.farmer_id)) || {name:'Farmer #'+b.farmer_id, crop:b.crop};
    const record = RECORDS.find(r => String(r.booking_id) === String(b.id));
    return {
      id: b.id,
      tracking_id: b.tracking_id || 'TRK-2026-000',
      token: b.token_number,
      name: farmer.name,
      crop: b.crop || farmer.crop,
      qty: b.quantity ? (b.quantity + (STATE.lang==='hi'?' क्विंटल':' qtl')) : '40 qtl',
      status: record && record.status === 'Completed' ? 'Completed' : b.status,
      call_time: b.call_time || '08:30 AM',
      procurement_date: b.procurement_date || '2026-08-24'
    };
  });

  ADMIN_CENTRES_TABLE = CENTRES.map(c => {
    const bCount = BOOKINGS.filter(b => {
      const sched = scheduleFor(b);
      return sched && String(sched.centre_id) === String(c.id);
    }).length;
    return {
      id: c.id,
      name: c.name,
      officer: c.officer || 'Officer Assigned',
      bookings: bCount,
      capacity: c.capacity,
      available_slots: c.available_slots,

    };
  });
}

/* ============================= TOAST ============================= */
function toast(msg, kind='success'){
  const map = {success:{bg:'var(--green-700)', icon:'✓'}, info:{bg:'var(--blue-700)', icon:'ℹ'}, warn:{bg:'var(--orange-600)', icon:'!'}, error:{bg:'var(--red-600)', icon:'✕'}};
  const c = map[kind]||map.success;
  const el = document.createElement('div');
  el.className='toast flex items-center gap-2.5 text-white text-xs sm:text-sm font-semibold px-3.5 py-3 rounded-2xl shadow-2xl border border-white/15 backdrop-blur-md w-full';
  el.style.background = c.bg;
  el.innerHTML = `<span class="w-5 h-5 rounded-full bg-white/25 flex items-center justify-center text-xs font-bold flex-shrink-0">${c.icon}</span><span class="break-words">${msg}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s, transform .3s'; el.style.opacity='0'; el.style.transform='translateY(-8px)'; setTimeout(()=>el.remove(),300); }, 3200);
}

function handleLoginFormSubmit(){
  const role = STATE.authRole || 'farmer';
  if(role === 'farmer'){
    const phoneEl = document.getElementById('authPhone');
    let phone = (phoneEl ? phoneEl.value : STATE.authPhone || '').trim().replace(/\D/g, '');
    if(phone.length > 10) phone = phone.slice(-10);

    const existing = FARMERS.find(f => f.phone && (f.phone === phone || f.phone.endsWith(phone) || phone.endsWith(f.phone.slice(-10))));
    if(!existing){
      openUnregisteredFarmerModal(phone);
      toast(STATE.lang==='hi'?'मोबाइल नंबर पंजीकृत नहीं है! कृपया पंजीकरण करें':'Mobile number not registered! Please register first','warn');
      return;
    }
    if(!STATE.otpSent){
      toast(STATE.lang==='hi'?'कृपया पहले मोबाइल नंबर दर्ज करके "ओटीपी पाएं" पर क्लिक करें':'Please enter mobile number and click "Get OTP" first','warn');
      return;
    }
    if(!STATE.mobileVerified){
      toast(STATE.lang==='hi'?'कृपया पहले "ओटीपी जांचें" (कोड: 123456) पर क्लिक करके सत्यापित करें':'Please click "Verify OTP" (code: 123456) first before logging in','warn');
      verifyFarmerOtp();
      return;
    }
  }
  doAuth('login');
  closeModal();
}

function handleTraceTokenSearch(){
  const inputEl = document.getElementById('traceInput');
  const resArea = document.getElementById('traceResultArea');
  if(!inputEl || !resArea) return;
  const q = inputEl.value.trim().toUpperCase();
  if(!q){
    toast(STATE.lang==='hi'?'कृपया टोकन नंबर या ट्रैकिंग आईडी दर्ज करें':'Please enter token number or tracking ID','warn');
    return;
  }

  const found = BOOKINGS.find(b => (b.token_number && b.token_number.toUpperCase() === q) || (b.tracking_id && b.tracking_id.toUpperCase() === q));
  
  if(found){
    STATE.trackedBooking = found;
    STATE.trackedToken = found.token_number;
    if(STATE.booking){
      STATE.booking.token = found.token_number;
      STATE.booking.trackingId = found.tracking_id;
    }
    const farmerObj = FARMERS.find(f => String(f.id) === String(found.farmer_id));
    const sched = (SCHEDULES.find(s => s.id === found.schedule_id) || SCHEDULES[0]);
    const centre = (CENTRES.find(c => c.id === (sched ? sched.centre_id : 1)) || CENTRES[0]);
    const ahead = BOOKINGS.filter(b => b.schedule_id === found.schedule_id && b.id < found.id && b.status !== 'Completed').length;

    resArea.classList.remove('hidden');
    resArea.innerHTML = `
    <div class="fade-up card-flat p-4 bg-[var(--cream)] border border-[var(--line-strong)] text-xs sm:text-sm space-y-2.5">
      <div class="flex justify-between items-center pb-2 border-b border-[var(--line)]">
        <div>
          <div class="text-[10px] font-bold text-[var(--ink-500)] uppercase">${t('yourToken')}</div>
          <div class="font-mono text-xl font-extrabold text-[var(--orange-700)]">${found.token_number}</div>
        </div>
        <span class="badge ${found.status==='Completed'?'badge-green':found.status==='In Progress'?'badge-orange':'badge-blue'}">${found.status}</span>
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div><span class="text-[var(--ink-500)]">Farmer:</span> <b class="text-[var(--ink-900)]">${farmerObj?farmerObj.name:'Verified Farmer'}</b></div>
        <div><span class="text-[var(--ink-500)]">Crop:</span> <b class="text-[var(--ink-900)]">${cropNameDisplay(found.crop)} (${found.quantity} qtl)</b></div>
        <div><span class="text-[var(--ink-500)]">Centre:</span> <b class="text-[var(--ink-900)]">${centre.name}</b></div>
        <div><span class="text-[var(--ink-500)]">Date:</span> <b class="text-[var(--ink-900)]">${formatDate(found.procurement_date)}</b></div>
        <div><span class="text-[var(--ink-500)]">Ahead in Queue:</span> <b class="text-[var(--green-700)]">${ahead} farmers</b></div>
        <div><span class="text-[var(--ink-500)]">Reporting:</span> <b class="font-mono text-[var(--green-700)]">${found.call_time || '08:30 AM'}</b></div>
      </div>
      <div class="pt-2 border-t border-[var(--line)] flex gap-2">
        <button type="button" onclick="closeModal(); navigate('landing'); render(); toast('Token ${found.token_number} pinned to live dashboard!','success');" class="btn btn-secondary btn-sm flex-1 text-xs font-bold">
          📍 ${STATE.lang==='hi'?'डैशबोर्ड पर देखें':'View on Home'}
        </button>
        <button type="button" onclick="closeModal(); if(STATE.user){ navigate('farmer-queue'); } else { openLoginModal(); toast('Please log in with farmer credentials to open real-time tracker','info'); }" class="btn btn-primary btn-sm flex-1 text-xs font-bold">
          🚀 ${t('openLiveQueue')}
        </button>
      </div>
    </div>`;
    toast((STATE.lang==='hi'?'टोकन मिल गया: ':'Token found: ') + found.token_number, 'success');
  } else {
    resArea.classList.remove('hidden');
    resArea.innerHTML = `
    <div class="fade-up p-3.5 bg-red-50 text-red-800 rounded-2xl border border-red-200 text-xs text-center space-y-1">
      <div class="font-bold">❌ ${STATE.lang==='hi'?'टोकन नहीं मिला':'Token Not Found'}</div>
      <p class="text-[11px] text-red-600">${STATE.lang==='hi'?'कृपया "DUR-001" या "TRK-2026-849201" जैसा मान्य टोकन दर्ज करें।':'No active booking matches &quot;'+q+'&quot;. Please check the number or choose a sample above.'}</p>
    </div>`;
  }
}

    <div class="font-display text-2xl sm:text-3xl font-extrabold text-[var(--green-700)]">${n}</div>
    <div class="text-[11px] sm:text-xs font-bold text-[var(--ink-500)] mt-1 uppercase tracking-wide">${l}</div>
  </div>`;
}

          ${['farmer','officer','admin'].map(r=>`
          <button onclick="STATE.authRole='${r}'; STATE.otpSent=false; STATE.mobileVerified=false; render();" class="btn-sm rounded-xl font-bold transition-all text-xs ${((STATE.authRole||'farmer')===r)?'bg-white shadow-md text-[var(--green-700)]':'text-[var(--ink-500)]'}" style="padding:.5rem .3rem">

              <label class="label">${t('aadhaarNumber')}</label>

            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="label mb-0">${t('mobileNumber')}</label>
                <a href="#" onclick="openPasswordResetModal(); return false;" class="text-[11px] font-bold text-[var(--green-700)] hover:underline">${STATE.lang==='hi'?'सहायता / पासवर्ड?':'Forgot Password / Help?'}</a>
              </div>
              <div class="flex gap-2">
                <input id="authPhone" autocomplete="off" value="${STATE.authPhone||''}" oninput="STATE.authPhone=this.value; if(STATE.otpSent){STATE.otpSent=false; STATE.mobileVerified=false; render();}" class="input font-mono font-bold" placeholder="+91 98XXXXXXXX" required>
                <button type="button" onclick="requestFarmerOtp()" class="btn ${STATE.otpSent?'btn-outline text-[var(--ink-500)]':'btn-primary'} btn-sm flex-shrink-0 text-xs font-bold px-3">
                  ${STATE.otpSent ? (STATE.lang==='hi'?'पुनः भेजें':'Resend OTP') : (STATE.lang==='hi'?'ओटीपी पाएं':'Get OTP')}
                </button>
              </div>
            </div>

            ${!isLogin ? `
            <div>
              <label class="label">${t('villageBlock')}</label>
              <input id="authVillage" autocomplete="off" value="${STATE.authVillage||''}" oninput="STATE.authVillage=this.value;" class="input" placeholder="${t('enterVillage')}" required>
            </div>
            <div>
              <label class="label">${t('landArea')}</label>
              <input id="authLandArea" autocomplete="off" type="number" min="0.1" step="0.1" value="${STATE.authLandArea||''}" oninput="STATE.authLandArea=this.value;" class="input font-bold" placeholder="${t('enterLandArea')}" required>
            </div>
            <div>
              <label class="label">${t('cropLabel')}</label>
              <select id="authCrop" class="input font-bold" required>
                ${CROPS.map(c=>`<option value="${c.name}">${STATE.lang==='hi'?c.nameHi:c.name} (${fmtINR(c.msp)}/qtl)</option>`).join('')}
              </select>

            ${STATE.otpSent ? `
            <!-- OTP Input with Verify OTP action -->
            <div class="fade-up bg-[var(--paper)] p-3 rounded-2xl border border-[var(--line)]">
              <div class="flex justify-between items-center mb-1.5">
                <label class="label mb-0">${t('otpLabel')} <span class="text-[10px] text-[var(--green-700)] font-bold">(${STATE.lang==='hi'?'निश्चित कोड: 123456':'Fixed Code: 123456'})</span></label>
                ${STATE.mobileVerified ? `<span class="badge badge-green text-[10px] py-0.5">✓ ${STATE.lang==='hi'?'सत्यापित':'Verified'}</span>` : `<span class="badge badge-orange text-[10px] py-0.5">${STATE.lang==='hi'?'सत्यापन आवश्यक':'Verification Required'}</span>`}
              </div>
              <div class="flex gap-2">
                <input id="authOtp" autocomplete="off" type="password" maxlength="6" value="${STATE.authOtp||''}" oninput="STATE.authOtp=this.value; STATE.mobileVerified=false; if(this.value==='123456'){ verifyFarmerOtp(); }" class="input font-mono font-bold tracking-widest text-center" placeholder="${t('enterOtp')}" required>
                <button type="button" onclick="verifyFarmerOtp()" class="btn ${STATE.mobileVerified?'btn-primary':'btn-orange'} btn-sm flex-shrink-0 text-xs font-bold px-3.5">
                  ${STATE.mobileVerified ? '✓ ' + (STATE.lang==='hi'?'सत्यापित':'Verified') : (STATE.lang==='hi'?'ओटीपी जांचें':'Verify OTP')}

              </div>
            </div>
            ` : `
            <div class="p-3 bg-[var(--paper)] rounded-xl text-xs text-[var(--ink-500)] border border-[var(--line)] flex items-center gap-2">
              <span>📲</span> <span>${STATE.lang==='hi'?'मोबाइल नंबर दर्ज करें और ओटीपी बॉक्स के लिए "ओटीपी पाएं" पर क्लिक करें।':'Enter mobile number and click "Get OTP" to receive verification code.'}</span>
            </div>                                                                                                              1
            `}
          ` : ''}

          <!-- OFFICER LOGIN -->
          ${STATE.authRole==='officer' ? `
            <div>
              <label class="label">${t('empId')}</label>
              <input id="authOfficerId" autocomplete="off" value="" class="input font-mono font-bold uppercase" placeholder="e.g. OFF-7721" required>
            </div>
            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="label mb-0">${t('passwordLabel')} <span class="text-[10px] text-[var(--green-700)] font-bold">(${STATE.lang==='hi'?'पासवर्ड: 1000':'Password: 1000'})</span></label>
                <a href="#" onclick="openPasswordResetModal(); return false;" class="text-[11px] font-bold text-[var(--green-700)] hover:underline">${t('forgotPassword')}</a>
              </div>
              <input id="authPassword" autocomplete="off" type="password" value="" class="input font-mono font-bold" placeholder="${t('enterPassword')}" required>
            </div>
            <div class="p-3 bg-[var(--paper)] rounded-xl text-xs text-[var(--ink-500)] border border-[var(--line)]">
              ℹ️ ${STATE.lang==='hi'?'अधिकारी खाते जिला कृषि निदेशालय द्वारा अधिकृत होते हैं। नया पंजीकरण उपलब्ध नहीं है।':'Officer accounts are pre-authorized by Directorate. Public registration disabled.'}
            </div>
          ` : ''}

          <!-- ADMIN LOGIN -->
          ${STATE.authRole==='admin' ? `
            <div>
              <label class="label">${t('adminId')}</label>
              <input id="authAdminId" autocomplete="off" value="" class="input font-mono font-bold uppercase" placeholder="e.g. ADMIN-DURG" required>
            </div>
            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="label mb-0">${t('passwordLabel')} <span class="text-[10px] text-[var(--green-700)] font-bold">(${STATE.lang==='hi'?'पासवर्ड: 1000':'Password: 1000'})</span></label>
                <a href="#" onclick="openPasswordResetModal(); return false;" class="text-[11px] font-bold text-[var(--green-700)] hover:underline">${t('forgotPassword')}</a>
              </div>
              <input id="authPassword" autocomplete="off" type="password" value="" class="input font-mono font-bold" placeholder="${t('enterPassword')}" required>
            </div>
            <div class="p-3 bg-[var(--paper)] rounded-xl text-xs text-[var(--ink-500)] border border-[var(--line)]">
              🔒 ${STATE.lang==='hi'?'जिला संभाग प्रशासनिक पहुंच प्रतिबंधित है। केवल अधिकृत प्रशासक लॉगिन कर सकते हैं।':'Restricted District Admin access. Self-registration is strictly disabled.'}
            </div>
          ` : ''}

          <!-- Action / Submit Button -->
          ${STATE.authRole==='farmer' && !STATE.otpSent ? `
            <button type="button" onclick="requestFarmerOtp()" class="btn btn-secondary w-full py-3 text-sm font-bold shadow-md mt-4">
              ${STATE.lang==='hi'?'ओटीपी पाएं':'Get OTP'} ${ICO.arrow}
            </button>
          ` : STATE.authRole==='farmer' && !STATE.mobileVerified ? `
            <button type="button" onclick="verifyFarmerOtp()" class="btn btn-secondary w-full py-3 text-sm font-bold shadow-md mt-4 text-[var(--orange-700)] border-[var(--orange-500)]">
              ⚠️ ${STATE.lang==='hi'?'पहले ओटीपी जांचें (सत्यापन आवश्यक)':'Verify OTP First to Proceed'} ${ICO.arrow}
            </button>
          ` : `
            <button type="submit" class="btn btn-primary w-full py-3 text-sm font-bold shadow-lg mt-4">
              ${isLogin ? t('loginBtn') : t('createAccountBtn')} ${ICO.arrow}
            </button>
          `}
        </form>

        <!-- Registration link ONLY for Farmer role -->
        ${STATE.authRole==='farmer' ? `
        <div class="mt-5 pt-3 border-t border-[var(--line)] flex items-center justify-between text-xs text-[var(--ink-500)]">
          <span>${isLogin ? t('dontHaveAccount') : t('alreadyRegistered')} 
            <a href="#" onclick="navigate('${isLogin?'register':'login'}');return false;" class="font-bold text-[var(--green-700)] hover:underline">${isLogin ? t('register') : t('login')}</a>
          </span>
          <a href="#" onclick="openPasswordResetModal(); return false;" class="font-bold text-[var(--green-700)] hover:underline">${t('forgotPassword')}</a>
        </div>` : `
        <div class="text-center mt-5 pt-3 border-t border-[var(--line)]">
          <a href="#" onclick="openPasswordResetModal(); return false;" class="text-xs font-bold text-[var(--green-700)] hover:underline">${t('forgotPassword')}</a>
        </div>
        `}
      </div>
    </div>
  </section>`;
}

function handleAuthPageSubmit(effectiveMode){
  const role = STATE.authRole || 'farmer';
  if(role === 'farmer'){
    if(!STATE.otpSent){
      toast(STATE.lang==='hi'?'कृपया पहले मोबाइल नंबर दर्ज करके "ओटीपी पाएं" पर क्लिक करें':'Please enter mobile number and click "Get OTP" first','warn');
      return;
    }
    if(!STATE.mobileVerified){
      toast(STATE.lang==='hi'?'कृपया पहले "ओटीपी जांचें" (कोड: 123456) पर क्लिक करके सत्यापित करें':'Please click "Verify OTP" (code: 123456) first before logging in','warn');
      verifyFarmerOtp();
      return;
    }
  }
  doAuth(effectiveMode);
}

function requestFarmerOtp(isRegisterMode = false){
  const phoneEl = document.getElementById('authPhone');
  let phone = (phoneEl ? phoneEl.value : STATE.authPhone || '').trim().replace(/\D/g, '');
  if(phone.length > 10) phone = phone.slice(-10);

  if(!phone || phone.length < 10){
    toast(STATE.lang==='hi'?'कृपया पहले 10 अंकों का मान्य मोबाइल नंबर दर्ज करें':'Please enter a valid 10-digit mobile number first','error');
    return;
  }

  // If in login mode, verify that the farmer exists in the database
  const isRegister = isRegisterMode || STATE.route === 'register';
  const existingFarmer = FARMERS.find(f => f.phone && (f.phone === phone || f.phone.endsWith(phone) || phone.endsWith(f.phone.slice(-10))));

  if(!isRegister && !existingFarmer){
    openUnregisteredFarmerModal(phone);
    toast(STATE.lang==='hi'?'मोबाइल नंबर पंजीकृत नहीं है! कृपया पहले किसान पंजीकरण करें':'Mobile number not registered! Please register as a farmer first.','warn');
    return;
  }

  STATE.authPhone = phone;
  STATE.otpSent = true;
  STATE.mobileVerified = false;
  STATE.authOtp = '';
  toast(STATE.lang==='hi'?'ओटीपी भेजा गया! (निश्चित कोड: 123456)':'OTP sent successfully! (Fixed Code: 123456)','success');
  render();
  if(document.getElementById('modal-root')?.innerHTML) openLoginModal();
}

function verifyFarmerOtp(){
  const phoneEl = document.getElementById('authPhone');
  const otpEl = document.getElementById('authOtp');
  let phone = (phoneEl ? phoneEl.value : STATE.authPhone || '').trim().replace(/\D/g, '');
  if(phone.length > 10) phone = phone.slice(-10);
  const otp = (otpEl ? otpEl.value : STATE.authOtp || '').trim();

  if(!phone || phone.length < 10){
    STATE.mobileVerified = false;
    toast(STATE.lang==='hi'?'कृपया पहले 10 अंकों का मान्य मोबाइल नंबर दर्ज करें':'Please enter a valid 10-digit mobile number first','error');
    return;
  }

  if(!STATE.otpSent){
    toast(STATE.lang==='hi'?'कृपया पहले "ओटीपी प्राप्त करें" बटन दबाएं':'Please click "Get OTP" first','warn');
    return;
  }

  if(!otp){
    STATE.mobileVerified = false;
    toast(STATE.lang==='hi'?'कृपया 6 अंकों का ओटीपी दर्ज करें (निश्चित कोड: 123456)':'Please enter 6-digit OTP (fixed code: 123456)','warn');
    return;
  }

  if(otp !== '123456'){
    STATE.mobileVerified = false;
    toast(STATE.lang==='hi'?'अमान्य ओटीपी — निश्चित कोड 123456 दर्ज करें':'Invalid OTP — Please enter fixed code 123456','error');
    render();
    if(document.getElementById('modal-root')?.innerHTML) openLoginModal();
    return;
  }

  STATE.authPhone = phone;
  STATE.authOtp = otp;
  STATE.mobileVerified = true;
  toast(STATE.lang==='hi'?'ओटीपी 123456 सत्यापित हुआ! अब लॉगिन / पंजीकरण करें':'OTP 123456 verified! You can now proceed','success');
  render();
  if(document.getElementById('modal-root')?.innerHTML) openLoginModal();
}

async function doAuth(mode){
  const role = STATE.authRole || 'farmer';

  if(role === 'farmer'){
    const phoneEl = document.getElementById('authPhone');
    const otpEl = document.getElementById('authOtp');
    let phone = (phoneEl ? phoneEl.value : STATE.authPhone || '').trim().replace(/\D/g, '');
    if(phone.length > 10) phone = phone.slice(-10);
    const otp = (otpEl ? otpEl.value : STATE.authOtp || '').trim();

    if(!phone || phone.length < 10){
      toast(STATE.lang==='hi'?'कृपया 10 अंकों का मान्य मोबाइल नंबर दर्ज करें':'Please enter a valid 10-digit mobile number','error');
      return;
    }

    if(mode === 'login'){
      const existing = FARMERS.find(f => f.phone && (f.phone === phone || f.phone.endsWith(phone) || phone.endsWith(f.phone.slice(-10))));
      if(!existing){
        openUnregisteredFarmerModal(phone);
        toast(STATE.lang==='hi'?'मोबाइल नंबर पंजीकृत नहीं है! कृपया पंजीकरण करें':'Mobile number not registered! Please register first','warn');
        return;
      }

      if(!STATE.otpSent){
        toast(STATE.lang==='hi'?'कृपया पहले "ओटीपी प्राप्त करें" बटन दबाएं':'Please click "Get OTP" first','warn');
        return;
      }

      if(!STATE.mobileVerified || otp !== '123456'){
        STATE.mobileVerified = false;
        toast(STATE.lang==='hi'?'कृपया पहले "ओटीपी जांचें" बटन पर क्लिक करके 123456 सत्यापित करें':'Please click "Verify OTP" with 123456 first before logging in','warn');
        return;
      }

      FARMER = existing;
      STATE.user = {role:'farmer', name: FARMER.name};
      persistState();
      buildLiveState();
      closeModal();
      toast((STATE.lang==='hi'?'नमस्ते, ':'Welcome, ') + FARMER.name + '!','success');
      navigate('farmer-dash');
      return;
    }

    // Register mode
    if(mode === 'register'){
      if(!STATE.otpSent){
        toast(STATE.lang==='hi'?'कृपया पहले "ओटीपी प्राप्त करें" बटन दबाएं':'Please click "Get OTP" first','warn');
        return;
      }

      if(!STATE.mobileVerified || otp !== '123456'){
        STATE.mobileVerified = false;
        toast(STATE.lang==='hi'?'कृपया पहले "ओटीपी जांचें" बटन पर क्लिक करके 123456 सत्यापित करें':'Please click "Verify OTP" with 123456 first before registering','warn');
        return;
      }

      const name = (document.getElementById('authName')?.value || STATE.authName || '').trim();
      const aadhaar = (document.getElementById('authAadhaar')?.value || STATE.authAadhaar || '').replace(/\D/g, '').trim();
      const village = (document.getElementById('authVillage')?.value || STATE.authVillage || '').trim();
      const landArea = parseFloat(document.getElementById('authLandArea')?.value || STATE.authLandArea || '4.5');
      const crop = document.getElementById('authCrop')?.value || 'Wheat';

      if(!name){
        toast(STATE.lang==='hi'?'कृपया अपना पूरा नाम दर्ज करें':'Please enter your full name','error');
        return;
      }
      if(aadhaar.length !== 12){
        toast(STATE.lang==='hi'?'कृपया 12 अंकों का आधार नंबर दर्ज करें':'Please enter a valid 12-digit Aadhaar number','error');
        return;
      }

      const aadhaarOwner = FARMERS.find(f => String(f.aadhaar || '').replace(/\D/g, '') === aadhaar);
      if(aadhaarOwner && !String(aadhaarOwner.phone || '').endsWith(phone)){
        toast(STATE.lang==='hi'?'यह आधार नंबर पहले से पंजीकृत है':'This Aadhaar number is already registered','error');
        return;
      }

      let existing = FARMERS.find(f => f.phone && (f.phone === phone || f.phone.endsWith(phone)));
      if(existing){
        existing.name = name;
        existing.aadhaar = aadhaar;
        existing.village = village || existing.village;
        existing.land_area = landArea || existing.land_area;
        existing.crop = crop || existing.crop;
        existing.crops = farmerCrops(existing).includes(crop) ? farmerCrops(existing) : [...farmerCrops(existing), crop];
        FARMER = existing;
      } else {
        const newFarmer = {
          id: Math.max(0, ...FARMERS.map(f => Number(f.id) || 0)) + 1,
          name,
          phone,
          village: village || 'Durg Block · Selud',
          land_area: landArea,
          crop,
          crops: [crop],
          aadhaar,
          bank_acc: 'SBIN000' + Math.floor(1000 + Math.random()*9000) + ' · ' + Math.floor(100000 + Math.random()*900000) + 'XXXX'
        };
        FARMERS.push(newFarmer);
        FARMER = newFarmer;
        STATE.supabaseFarmerCount = FARMERS.length;
        persistState();

        try {
          if(supabaseClient){
            const {error} = await supabaseClient.from('farmers').insert([newFarmer]);
            if(error) console.warn('Farmer saved locally; Supabase insert notice:', error);
          }
        }catch(e){}
      }

      STATE.user = {role:'farmer', name: FARMER.name};
      persistState();
      buildLiveState();
      closeModal();
      toast(STATE.lang==='hi'?'किसान खाता सफलतापूर्वक पंजीकृत हुआ!':'Farmer registered successfully!','success');
      navigate('farmer-dash');
      return;
    }
  }

  // OFFICER LOGIN (Password 1000)
  if(role === 'officer'){
    const pwdEl = document.getElementById('authPassword');
    const officerIdEl = document.getElementById('authOfficerId');
    const pwd = pwdEl ? pwdEl.value.trim() : '';
    const officerId = officerIdEl ? officerIdEl.value.trim() : (STATE.authOfficerId || '');

    if(!officerId){
      toast(STATE.lang==='hi'?'कृपया अधिकारी कर्मचारी आईडी दर्ज करें':'Enter your Officer Employee ID','error');
      return;
    }

    if(!pwd){
      toast(STATE.lang==='hi'?'कृपया पासवर्ड दर्ज करें (निश्चित पासवर्ड: 1000)':'Please enter password (fixed: 1000)','error');
      return;
    }

    if(pwd !== '1000'){
      toast(STATE.lang==='hi'?'अमान्य पासवर्ड — निश्चित पासवर्ड 1000 का उपयोग करें':'Invalid password — Use fixed password 1000','error');
      return;
    }

    STATE.user = {role:'officer', name: `Officer Arun Patel (${officerId})`};
    persistState();
    buildLiveState();
    toast(STATE.lang==='hi'?'अधिकारी पोर्टल में स्वागत है!':'Welcome to Officer Management Portal!','success');
    navigate('officer-dash');
    return;
  }

  // ADMIN LOGIN (Password 1000)
  if(role === 'admin'){
    const pwdEl = document.getElementById('authPassword');
    const adminIdEl = document.getElementById('authAdminId');
    const pwd = pwdEl ? pwdEl.value.trim() : '';
    const adminId = adminIdEl ? adminIdEl.value.trim() : (STATE.authAdminId || '');

    if(!adminId){
      toast(STATE.lang==='hi'?'कृपया प्रशासक आईडी दर्ज करें':'Enter your Admin Official ID','error');
      return;
    }

    if(!pwd){
      toast(STATE.lang==='hi'?'कृपया पासवर्ड दर्ज करें (निश्चित पासवर्ड: 1000)':'Please enter password (fixed: 1000)','error');
      return;
    }

    if(pwd !== '1000'){
      toast(STATE.lang==='hi'?'अमान्य पासवर्ड — निश्चित पासवर्ड 1000 का उपयोग करें':'Invalid password — Use fixed password 1000','error');
      return;
    }

    STATE.user = {role:'admin', name: `Directorate Admin (${adminId})`};
    persistState();
    buildLiveState();
    toast(STATE.lang==='hi'?'जिला प्रशासन कंसोल में स्वागत है!':'Welcome to District Directorate Admin Console!','success');
    navigate('admin-dash');
    return;
  }
}

/* ============================= 4-STEP BOOKING FLOW (CALENDAR & CLOCK EQUIPPED) ============================= */
function bookingStepper(step){
  const steps=[t('stepCropQty'), t('stepCentre'), t('stepDateTime'), t('stepConfirm')];
  return `
  <div class="flex items-center mb-6 max-w-2xl overflow-x-auto pb-2">
    ${steps.map((s,i)=>{
      const n=i+1; const state = n<step?'done':n===step?'active':'todo';
      return `
      <div class="flex items-center ${i<steps.length-1?'flex-1':''}">
        <div class="flex flex-col items-center flex-shrink-0">
          <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold border-2 transition-all ${state==='done'?'bg-[var(--green-600)] border-[var(--green-600)] text-white shadow-md':state==='active'?'border-[var(--green-600)] text-[var(--green-600)] bg-white ring-4 ring-emerald-100':'border-[var(--line-strong)] text-[var(--ink-300)] bg-white'}">
            ${state==='done'?ICO.check:n}
          </div>
          <div class="text-[10px] sm:text-[11px] font-bold mt-1 text-center w-20 sm:w-24 ${state==='todo'?'text-[var(--ink-300)]':'text-[var(--ink-700)]'}">${s}</div>
        </div>
        ${i<steps.length-1?`<div class="flex-1 h-1 mx-1.5 mb-4 rounded-full ${n<step?'bg-[var(--green-600)]':'bg-[var(--line-strong)]'}"></div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}

function renderBooking(){
  if(!requireAuth('farmer')) return '';
  const st = STATE.booking;
  if(!st.crop) st.crop = CROPS[0].id;
  if(!st.customDate) st.customDate = '2026-08-25';
  if(!st.customTime) st.customTime = '09:00';
  
  let body='';
  if(st.step===1){
    body=`
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 mb-5">
      ${CROPS.map(c=>`
      <button onclick="STATE.booking.crop='${c.id}'; render();" class="card-flat p-4 text-left hover-lift ${st.crop===c.id?'ring-2 ring-[var(--green-600)] border-[var(--green-600)] bg-[var(--cream)]':''}">
        <div class="text-2xl mb-1.5">${c.id==='wheat'?'🌿':c.id==='rice'?'🌾':'🌽'}</div>
        <div class="font-display font-bold text-base text-[var(--ink-900)]">${STATE.lang==='hi'?c.nameHi:c.name}</div>
        <div class="text-xs text-[var(--ink-500)] mt-1.5">${STATE.lang==='hi'?'समर्थन मूल्य:':'MSP Price:'} <b class="text-[var(--green-700)] font-bold">${fmtINR(c.msp)}/${STATE.lang==='hi'?'क्विंटल':'qtl'}</b></div>
      </button>`).join('')}
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
      <div>
        <label class="label">${t('expectedQty')}</label>
        <input id="qtyInput" type="number" min="1" max="500" class="input font-bold" placeholder="e.g. 40" value="${st.qty||40}" oninput="STATE.booking.qty=parseFloat(this.value)||0">
      </div>
      <div>

        <input id="landAreaInput" type="number" min="0.1" step="0.1" class="input font-bold" placeholder="e.g. 4.5" value="${st.landArea||FARMER.land_area||'4.5'}" oninput="STATE.booking.landArea=this.value">

  } else if(st.step===2){
    body=`

      ${CENTRES.filter(c=>c.status==='Active').map(c=>{

        return `
      <button onclick="STATE.booking.centre=${c.id}; render();" class="card-flat p-4 text-left hover-lift ${st.centre===c.id?'ring-2 ring-[var(--green-600)] border-[var(--green-600)] bg-[var(--cream)]':''}">

async function confirmBooking(){
  const st = STATE.booking;
  const crop = CROPS.find(c=>c.id===st.crop) || CROPS[0];
  const centre = CENTRES.find(c=>c.id===st.centre) || CENTRES[0];
  const chosenDate = st.customDate || '2026-08-25';
  const chosenTime = st.customTime || '09:00';

  const timing = calculateTimingForBooking(null, 1, chosenTime, chosenDate);
  const trackingId = generateFreshTrackingId();
  const tokenNumber = generateSequentialToken(centre.id);

  centre.available_slots = Math.max(0, (centre.available_slots || 100) - 1);

  const newBooking = {
    id: 1000 + BOOKINGS.length + 1,
    tracking_id: trackingId,
    farmer_id: FARMER.id,
    schedule_id: 101,
    token_number: tokenNumber,
    crop: crop.name,
    quantity: st.qty || 40,

    procurement_date: chosenDate,
    booking_date: `${chosenDate} ${chosenTime}`,
    call_time: timing.callTime,
    arrival_time: timing.arrivalTime

  BOOKINGS.unshift(newBooking);
  if(STATE.supabaseBookingCount !== undefined){

  NOTIFICATIONS.unshift({

function startQueueSim(){
  stopQueueSim();
  queueInterval = setInterval(()=>{
    if(STATE.route!=='farmer-queue') return;
    const booking = getActiveFarmerBooking();
    if(!booking) return;
    const metrics = getQueueMetrics(booking);
    const ac=document.getElementById('ahead-count'), em=document.getElementById('eta-min'), token=document.getElementById('serving-token');
    if(ac) ac.textContent = metrics.ahead;
    if(em) em.textContent = metrics.waitMinutes + ' min';
    if(token) token.textContent = metrics.current ? metrics.current.token_number : '—';
  }, 30000);
}
function stopQueueSim(){ if(queueInterval){ clearInterval(queueInterval); queueInterval=null; } }

  const booking = myBookings[0] || BOOKINGS[0];
  const record = RECORDS.find(r => String(r.booking_id) === String(booking.id));

  const stages = [

      time: formatDate(booking.procurement_date) + ' · ' + (booking.call_time || '08:30 AM'),

    {
      label: STATE.lang==='hi'?'5. किसान बैंक खाते में जमा':'5. Bank Account Credited',

  <div class="card p-5 sm:p-8 max-w-3xl border-slate-200/80 bg-white">

        <div class="text-xs sm:text-sm text-[var(--ink-500)]">${t('trackingIdTh')}: <span class="font-mono font-bold text-[var(--green-700)]">${booking.tracking_id || 'TRK-2026-849201'}</span> · 📅 <b>${formatDate(booking.procurement_date)}</b></div>
      </div>

    <div class="relative pl-3">
      <div class="timeline-line"></div>
      <div class="space-y-6 sm:space-y-8">
        ${stages.map(s=>`
        <div class="relative pl-8 sm:pl-10">

function officerCallNext(){
  const current = BOOKINGS.find(b => b.status === 'In Progress');
  if(current){
    toast((STATE.lang==='hi'?'पहले वर्तमान टोकन पूरा करें: ':'Complete the current token first: ') + current.token_number,'warn');
    return;
  }
  const waiting = BOOKINGS.filter(b => b.status === 'Booked').sort((a,b) => (a.id || 0) - (b.id || 0))[0];
  if(!waiting){
    toast(STATE.lang==='hi'?'कतार में कोई प्रतीक्षारत किसान नहीं है':'No farmers waiting in queue','info');
    return;
  }
  waiting.status = 'In Progress';
  
  NOTIFICATIONS.unshift({
    id: NOTIFICATIONS.length + 1,
    farmer_id: waiting.farmer_id,
    title: `Token ${waiting.token_number} Called!`,
    titleHi: `टोकन ${waiting.token_number} बुलाया गया!`,
    message: `Your token ${waiting.token_number} is now active at Counter #1. Please proceed for verification.`,
    messageHi: `आपका टोकन ${waiting.token_number} अब काउंटर #1 पर सक्रिय है। कृपया आगे बढ़ें।`,
    icon: '📢',
    is_read: false,
    created_at: new Date().toISOString()
  });

function calcNetWeight(){
  const gross = parseFloat(document.getElementById('weighGross').value)||0;
  const tare = parseFloat(document.getElementById('weighTare').value)||0;
  const net = Math.max(0, gross - tare).toFixed(1);
  const disp = document.getElementById('weighNetDisplay');
  if(disp) disp.textContent = net + ' qtl';
}

function officerSaveProcurement(bookingId){
  const booking = BOOKINGS.find(b => b.id === bookingId);
  if(!booking) return;

  const gross = parseFloat(document.getElementById('weighGross').value)||42.5;
  const tare = parseFloat(document.getElementById('weighTare').value)||2.5;
  const moisture = parseFloat(document.getElementById('weighMoisture').value)||11.5;
  const grade = document.getElementById('weighGrade').value || 'Grade A (FAQ)';
  const net = Math.max(0.1, gross - tare);

  booking.status = 'Completed';
  booking.quantity = net;

  const msp = cropPrice(booking.crop);
  const grossAmt = msp * net;
  const mandiFee = Math.round(grossAmt * 0.015);
  const netPayable = grossAmt - mandiFee;

  const newRec = {
    id: `REC-2026-0${RECORDS.length + 90}`,
    booking_id: booking.id,
    tracking_id: booking.tracking_id,
    farmer_id: booking.farmer_id,
    crop: booking.crop,
    quantity: net,
    quality_grade: grade,
    gross_weight: gross,
    tare_weight: tare,
    net_weight: net,
    moisture: moisture,
    status: 'Completed',
    payment_status: 'Processing',
    procurement_date: new Date().toISOString().slice(0,10),
    amount: grossAmt,
    mandi_fee: mandiFee,
    net_payable: netPayable
  };

  RECORDS.unshift(newRec);

  NOTIFICATIONS.unshift({
    id: NOTIFICATIONS.length + 1,
    farmer_id: booking.farmer_id,
    title: `Procurement Completed — ${net} qtl ${booking.crop}`,
    titleHi: `खरीद पूर्ण — ${net} क्विंटल ${cropNameDisplay(booking.crop)}`,
    message: `Quality: ${grade}. Net amount of ₹${netPayable.toLocaleString('en-IN')} approved and sent for treasury bank credit.`,
    messageHi: `गुणवत्ता: ${grade}। शुद्ध राशि ₹${netPayable.toLocaleString('en-IN')} स्वीकृत एवं बैंक खाते में जमा हेतु प्रेषित।`,
    icon: '💰',
    is_read: false,
    created_at: new Date().toISOString()
  });

  persistState();
  buildLiveState();
  closeModal();
  toast(STATE.lang==='hi'?'खरीद रिकॉर्ड सहेजा गया और कोषागार को भेजा गया!':'Procurement recorded and dispatched to treasury!','success');
  render();
}

async function saveOfficerNewSlot(){
  const date = document.getElementById('newSlotDate').value || '2026-08-25';
  const centreId = Number(document.getElementById('newSlotCentre').value) || 1;
  const start = document.getElementById('newSlotStart').value || '14:00';
  const end = document.getElementById('newSlotEnd').value || '17:00';
  const cap = parseInt(document.getElementById('newSlotCap').value, 10) || 40;

  const newSched = {
    id: Math.max(100, ...SCHEDULES.map(s => Number(s.id) || 0)) + 1,
    centre_id: centreId,
    procurement_date: date,
    start_time: start,
    end_time: end,
    total_slots: cap,
    booked_slots: 0,
    status: 'Open'
  };

  SCHEDULES.push(newSched);
  try {
    if(supabaseClient) await supabaseClient.from('schedules').insert([newSched]);

  persistState();
  buildLiveState();
  closeModal();
  toast(STATE.lang==='hi'?'नया खरीद स्लॉट सफलतापूर्वक जोड़ा गया!':'New procurement slot added!','success');

}

async function adminSaveCropPrice(cropId){
  const inp = document.getElementById(`admin-price-${cropId}`);
  if(!inp) return;
  const newPrice = parseFloat(inp.value);
  if(!newPrice || newPrice <= 0){
    toast(STATE.lang==='hi'?'कृपया मान्य मूल्य दर्ज करें':'Enter valid price','error');
    return;
  }
  const crop = CROPS.find(c=>c.id===cropId);
  if(crop){
    crop.msp = newPrice;
    try {
      if(supabaseClient) await supabaseClient.from('crops').update({msp:newPrice}).eq('id', cropId);
    }catch(e){ console.warn('Crop price saved locally; Supabase update notice:', e); }
    persistState();
    buildLiveState();
    toast(`${crop.name} MSP: ₹${newPrice}/qtl ` + (STATE.lang==='hi'?'अपडेट हुआ!':'updated across site!'), 'success');
    render();
  }
}

async function saveAdminNewCentre(){
  const name = document.getElementById('newCentreName').value.trim();
  const city = document.getElementById('newCentreCity').value.trim();
  const loc = document.getElementById('newCentreLoc').value.trim();
  const cap = parseInt(document.getElementById('newCentreCap').value, 10) || 120;
  const officer = document.getElementById('newCentreOfficer').value.trim() || 'Officer In-Charge';

  const newC = {
    id: CENTRES.length + 1,
    name,
    city,
    location: loc,
    capacity: cap,
    available_slots: cap,
    status: 'Active',
    officer
  };

  CENTRES.push(newC);
  
  SCHEDULES.push({
    id: SCHEDULES.length + 101,
    centre_id: newC.id,
    procurement_date: '2026-08-25',
    start_time: '08:30',
    end_time: '12:30',
    total_slots: Math.floor(cap / 2),
    booked_slots: 0,
    status: 'Open'
  });

  try {
    if(supabaseClient){
      await supabaseClient.from('centres').insert([newC]);
      await supabaseClient.from('schedules').insert([SCHEDULES[SCHEDULES.length - 1]]);
    }
  }catch(e){ console.warn('Centre saved locally; Supabase insert notice:', e); }

  persistState();
  buildLiveState();
  closeModal();
  toast(STATE.lang==='hi'?'नया केंद्र सफलतापूर्वक जोड़ा गया!':'New centre added to procurement network!','success');
  render();
}

async function adminToggleCentreStatus(id){
  const centre = CENTRES.find(c => c.id === id);
  if(centre){
    centre.status = centre.status === 'Active' ? 'Inactive' : 'Active';
    try {
      if(supabaseClient) await supabaseClient.from('centres').update({status:centre.status}).eq('id', id);
    }catch(e){ console.warn('Centre status saved locally; Supabase update notice:', e); }
    persistState();
    buildLiveState();
    toast(`${centre.name} status: ${centre.status}`, 'info');
    render();
  }
}

function adminResolveComplaint(id){
  const comp = COMPLAINTS.find(c => c.id === id);
  if(comp){
    comp.status = 'Resolved';
    persistState();
    toast((STATE.lang==='hi'?'शिकायत का समाधान दर्ज हुआ: ':'Complaint resolved: ') + id, 'success');
    render();
  }
}

/* ============================= MAIN ROUTER ============================= */
function render(){
  document.body.classList.toggle('cream-theme', STATE.theme === 'cream');
  stopQueueSim();
  const app = document.getElementById('app');
  let html='';
  switch(STATE.route){
    case 'landing': html = renderLanding(); break;
    case 'login': html = renderAuth('login'); break;
    case 'register': html = renderAuth('register'); break;
    case 'farmer-dash': html = renderFarmerDash(); break;
    case 'farmer-book': html = renderBooking(); break;
    case 'farmer-queue': html = renderQueue(); break;
    case 'farmer-tracking': html = renderTracking(); break;
    case 'farmer-payment': html = renderPayment(); break;
    case 'farmer-notifications': html = renderNotifications(); break;
    case 'officer-dash': case 'officer-schedule': case 'officer-verify': case 'officer-stats': html = renderOfficerSection(STATE.route); break;
    case 'admin-dash': case 'admin-centres': case 'admin-schedule': case 'admin-officers': case 'admin-reports': case 'admin-complaints': html = renderAdminSection(STATE.route); break;
    default: html = renderLanding();
  }
  if(html) app.innerHTML = `<div class="page-enter">${html}</div>`;
  if(STATE.route==='farmer-queue') startQueueSim();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', loadInitialData);
} else {
  loadInitialData();
}
</script>
